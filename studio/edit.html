<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Anything Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--col:#141416;--card:#1a1a1d;--line:#26262a;--txt:#ececef;--dim:#8b8b93;--faint:#5a5a62;--acc:#e8e3d9;--sel:#7aa2ff;--ok:#5bbf8a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 Inter,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
header a{color:var(--faint);text-decoration:none}header h1{font-size:14px;font-weight:600;margin:0}header .src{color:var(--dim)}header .sp{flex:1}
.from{font-size:11px;border:1px solid #3a4462;color:#aab6d8;border-radius:99px;padding:2px 9px}
.pill{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--txt)}
.pill:hover{border-color:var(--faint)}.pill.solid{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}.pill:disabled{opacity:.4;cursor:default}
.app{display:grid;grid-template-columns:250px 1fr 290px;min-height:0}
aside{background:var(--col);overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line)}
.sec{font-size:11px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:8px}
.sec span{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--faint)}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--card);border:1px solid transparent}
.layer.off{opacity:.45}.layer.hl{border-color:var(--sel)}
.layer .ic{width:26px;height:26px;border-radius:6px;background:#2a2a2e;display:grid;place-items:center;flex:none}
.layer small{display:block;color:var(--faint)}.layer .x{margin-left:auto;display:flex;gap:2px}
.layer .x button{background:none;border:0;cursor:pointer;color:var(--dim);width:24px;height:24px;border-radius:5px}.layer .x button:hover{background:#26262a;color:var(--txt)}
.empty{color:var(--faint);font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center}
main{display:flex;flex-direction:column;min-width:0;padding:16px 22px;gap:12px;overflow:auto}
.bar{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px}
.seg button{border:0;background:none;border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--dim)}.seg button.on{background:#26262a;color:var(--txt)}
.bar .sp{flex:1}.bar .hint{color:var(--faint);font-size:12px}
.view{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-height:70vh;align-self:center;flex:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{cursor:crosshair}
.wipe{position:absolute;top:0;bottom:0;width:2px;background:#fff;cursor:ew-resize;z-index:3;touch-action:none}
.wipe::after{content:"";position:absolute;top:50%;left:-11px;width:24px;height:24px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lab{position:absolute;bottom:10px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 9px;border-radius:99px;color:#ddd;pointer-events:none;z-index:2}
.ask{position:absolute;z-index:4;display:flex;align-items:center;gap:6px;background:rgba(20,20,22,.92);backdrop-filter:blur(8px);border:1px solid #3a4462;border-radius:12px;padding:6px 6px 6px 10px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.ask b{font-weight:500;color:#aab6d8;white-space:nowrap}
.ask input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:inherit;outline:none}
.ask button{border:0;border-radius:8px;background:var(--acc);color:#111;padding:4px 10px;cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--dim);font-size:12px}
.chip:hover{border-color:var(--faint);color:var(--txt)}.chip.on{border-color:var(--acc);color:var(--txt);background:#1f1f22}
.selc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card)}
.selc .ic{width:34px;height:34px;border-radius:8px;background:#2a2a2e;display:grid;place-items:center;font-size:18px}
.selc small{display:block;color:var(--faint)}
input.t{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font:inherit;outline:none}
input.t:focus{border-color:var(--faint)}
.drop{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--faint);font-size:12px;cursor:pointer}
.note{color:var(--faint);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;transition:opacity .3s;z-index:20}
@media (max-width:1000px){.app{grid-template-columns:1fr}aside.l,aside.r{border:0;border-top:1px solid var(--line)}aside.l{order:2}main{order:1}aside.r{order:3}}
</style></head><body>
<header><a href="../index.html" id="backLink">←</a><h1>Edit Anything</h1><span class="src" id="src"></span><span class="from hidden" id="from" style="display:none">from Director</span><span class="sp"></span>
 <span id="acts"></span></header>
<div class="app">
 <aside class="l" id="shared"></aside>
 <main>
  <div class="bar">
   <div class="seg" id="tool"><button data-t="click" class="on">Click to select</button><button data-t="place">Whole place</button></div>
   <span class="sp"></span>
   <div class="seg" id="cmp"><button data-c="after" class="on">Edited</button><button data-c="wipe">Compare</button><button data-c="before">Original</button></div>
  </div>
  <div class="view" id="view"><canvas id="orig"></canvas><canvas id="cv"></canvas>
   <div class="wipe" id="wipe" style="display:none"></div><span class="lab" id="lA" style="left:10px;display:none">Original</span><span class="lab" id="lB" style="right:10px;display:none">Edited</span></div>
  <div class="bar"><span class="hint" id="hint">Click Mia, Bolt, the sky or the ground. Esc cancels.</span></div>
 </main>
 <aside class="r">
  <div class="sec">Edits <span id="ecount"></span></div>
  <div class="layers" id="layers"></div>
  <div class="sec">Selected</div>
  <div id="selp"><div class="empty">Nothing selected yet.</div></div>
  <div class="sec">Reference <span>optional</span></div>
  <div class="drop" onclick="toast('Drop an image to guide the edit')">Drop a reference image</div>
  <div class="sec">Keep</div>
  <div class="chips" id="keep"><button class="chip on">Lighting</button><button class="chip on">Perspective</button><button class="chip on">Pose</button></div>
  <div class="note">Own footage only. Costumes, props and places — no real-person face swaps.</div>
 </aside>
</div>
<script src="../shared/lib/kit.js"></script><script src="../shared/styleboard/looks.js"></script><script src="scene.js"></script><script src="shell.js"></script><script>
const {$,$$}=K,W=640,H=360;
// Source: a keyframe handed over from Director, or a sample frame.
// Media handed over from another workflow (via the shared "Selected media" card), or a sample frame.
const from=new URLSearchParams(location.search).get('from'),hand=from?SC.get('osh-handoff'):null;
let look=SC.LOOKS[0],str=.8;const u=hand?.u??.3;
const base={...(hand?.spec||SC.SP({scene:'street',scale:1.3}))},prior=base.edits||{};delete base.edits;
const REG={mia:{n:'Mia',ic:'👧',sug:['astronaut suit','red raincoat','knight armour','remove']},bolt:{n:'Bolt',ic:'🤖',sug:['gold','rusty','bigger','glowing eyes','tiny crown','remove']},
 sky:{n:'Sky',ic:'🌤',sug:['sunset','night sky with stars','storm clouds','aurora','clear blue']},place:{n:'Place',ic:'🌍',sug:['Mars','snow','beach','flooded street','forest']}};
let layers=Object.entries(prior).map(([r,txt])=>({r,txt,on:true,id:Math.random()})),sel=null,tool='click',cmp='after',wx=.5,box={},busy=null;
$('#src').textContent=hand?'/ '+hand.label:'/ sample frame';
if(hand&&hand.from==='director'&&hand.ref?.key!=null){$('#from').style.display='';$('#backLink').href='director.html';
 $('#acts').innerHTML='<button class="pill" id="cancel">Cancel</button> <button class="pill solid" id="apply">Apply to keyframe →</button>';
 $('#cancel').onclick=()=>location.href='director.html';
 $('#apply').onclick=()=>{writeBack();location.href='director.html'}}
else $('#acts').innerHTML='<button class="pill solid" onclick="toast(\'mock: exports the edited frame\')">Export frame</button>';
function writeBack(){const e=edits();SC.set('osh-edit-return',{shot:hand.ref.shot,key:hand.ref.key,spec:{...base,edits:e},n:Object.keys(e).length})}
const edits=()=>Object.fromEntries(layers.filter(l=>l.on).map(l=>[l.r,l.txt]));
// ---------- layers ----------
function renderLayers(){SHELL.mark([sel,...layers.filter(l=>l.on).map(l=>l.r)].filter(r=>r==='mia'||r==='bolt'));$('#ecount').textContent=layers.length?`${layers.filter(l=>l.on).length}/${layers.length} on`:'';
 if(!layers.length){$('#layers').innerHTML='<div class="empty">Click anything in the frame and say what it should be.</div>';return}
 $('#layers').innerHTML='';layers.forEach(l=>{const d=document.createElement('div');d.className='layer'+(l.on?'':' off')+(sel===l.r?' hl':'');
  d.innerHTML=`<span class="ic">${REG[l.r].ic}</span><div>${REG[l.r].n} → ${l.txt}<small>${l.r==='place'||l.r==='sky'?'whole frame':'tracked region'}</small></div><span class="x"><button title="Show / hide">${l.on?'◉':'○'}</button><button title="Remove">✕</button></span>`;
  const [eye,x]=d.querySelectorAll('.x button');eye.onclick=()=>{l.on=!l.on;renderLayers()};x.onclick=()=>{layers=layers.filter(y=>y!==l);renderLayers()};
  d.onclick=e=>{if(e.target.closest('.x'))return;select(l.r)};$('#layers').append(d)})}
// ---------- selection ----------
function hit(x,y){if(tool==='place')return'place';for(const r of['bolt','mia']){const b=box[r];if(b&&x>b.x-4&&x<b.x+b.w+4&&y>b.y-4&&y<b.y+b.h+4)return r}return y<box.horizon?'sky':'place'}
function select(r,cx,cy){sel=r;$('.ask')?.remove();renderLayers();const R=REG[r],cur=layers.find(l=>l.r===r);
 $('#selp').innerHTML=`<div class="selc"><span class="ic">${R.ic}</span><div>${R.n}<small>${r==='mia'||r==='bolt'?'tracked through the shot':'whole frame'}</small></div></div>
  <input class="t" id="selIn" placeholder="What should ${R.n.toLowerCase()} become?" value="${cur?cur.txt:''}" style="margin-top:8px">
  <div class="chips" style="margin-top:8px">${R.sug.map(s=>`<button class="chip">${s}</button>`).join('')}</div>`;
 $$('#selp .chip').forEach(c=>c.onclick=()=>apply(r,c.textContent));$('#selIn').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())apply(r,e.target.value.trim())};
 const v=$('#view').getBoundingClientRect();const b=box[r],px=cx??(b?(b.x+b.w)/W*v.width+8:v.width/2-150),py=cy??(b?b.y/H*v.height:v.height*(r==='sky'?.15:.7));
 const a=document.createElement('div');a.className='ask';a.style.left=Math.max(8,Math.min(v.width-308,px))+'px';a.style.top=Math.max(8,Math.min(v.height-50,py))+'px';
 a.innerHTML=`<b>${R.ic} ${R.n} →</b><input placeholder="describe the change"><button>Edit</button>`;$('#view').append(a);const i=a.querySelector('input');i.focus();
 const go=()=>i.value.trim()&&apply(r,i.value.trim());i.onkeydown=e=>{if(e.key==='Enter')go();if(e.key==='Escape')clear()};a.querySelector('button').onclick=go;
 $('#hint').textContent=`Editing ${R.n.toLowerCase()} — type a change or pick a suggestion on the right.`}
function clear(){sel=null;$('.ask')?.remove();$('#selp').innerHTML='<div class="empty">Nothing selected yet.</div>';$('#hint').textContent='Click Mia, Bolt, the sky or the ground. Esc cancels.';renderLayers()}
async function apply(r,txt){$('.ask')?.remove();busy={r,t0:performance.now()};$('#hint').textContent=`Editing ${REG[r].n.toLowerCase()}…`;await K.sleep(800);busy=null;
 const ex=layers.find(l=>l.r===r);if(ex){ex.txt=txt;ex.on=true}else layers.push({r,txt,on:true,id:Math.random()});
 if(cmp==='before')setCmp('after');toast(`${REG[r].n} → ${txt}`);clear()}
$('#cv').onclick=e=>{if(cmp==='before')setCmp('after');const b=$('#cv').getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H;select(hit(x,y),e.clientX-b.left+12,e.clientY-b.top+12)};
addEventListener('keydown',e=>{if(e.key==='Escape')clear()});
$('#tool').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;$$('#tool button').forEach(x=>x.classList.toggle('on',x===b));if(tool==='place')select('place')};
// ---------- compare ----------
function setCmp(c){cmp=c;$$('#cmp button').forEach(x=>x.classList.toggle('on',x.dataset.c===c));const w=c==='wipe';['#wipe','#lA','#lB'].forEach(q=>$(q).style.display=w?'':'none');$('#cv').style.clipPath=w?`inset(0 0 0 ${wx*100}%)`:'none';$('#cv').style.visibility=c==='before'?'hidden':''}
$('#cmp').onclick=e=>{const b=e.target.closest('button');if(b)setCmp(b.dataset.c)};
const wp=$('#wipe');wp.onpointerdown=e=>{wp.setPointerCapture(e.pointerId);wp.onpointermove=ev=>{const r=$('#view').getBoundingClientRect();wx=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));wp.style.left=wx*100+'%';$('#cv').style.clipPath=`inset(0 0 0 ${wx*100}%)`}};wp.onpointerup=()=>wp.onpointermove=null;wp.style.left='50%';
$$('#keep .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.style.opacity=0,1700);setTimeout(()=>d.remove(),2100)}
// ---------- draw ----------
const g=K.canvas($('#cv'),W,H),go=K.canvas($('#orig'),W,H);
K.loop(t=>{SHELL.select({type:hand?.type||'frame',label:hand?hand.label:'Sample frame',spec:{...base,edits:edits()},u,ref:hand?.ref});const tt=2+Math.sin(t*.3)*.5;SC.frame(go,base,tt,u,look,str);box=SC.frame(g,{...base,edits:edits()},tt,u,look,str);
 const r=busy?busy.r:sel;if(r&&cmp!=='before'){g.save();g.strokeStyle='#7aa2ff';g.lineWidth=2;g.setLineDash([6,4]);g.lineDashOffset=-t*24;g.fillStyle=busy?`rgba(122,162,255,${.2+.15*Math.sin(t*10)})`:'rgba(122,162,255,.18)';
  const b=box[r];if(r==='sky'){g.fillRect(0,0,W,box.horizon);g.strokeRect(1,1,W-2,box.horizon-2)}else if(r==='place'){g.fillRect(0,box.horizon,W,H-box.horizon);g.strokeRect(1,box.horizon,W-2,H-box.horizon-1)}else if(b){g.fillRect(b.x,b.y,b.w,b.h);g.strokeRect(b.x,b.y,b.w,b.h)}g.restore()}});
SHELL.mount({app:'edit',elementHint:'click to edit',useLabel:e=>e.kind==='cast'?'select':'move here',
 beforeOpen:app=>{if(app==='director'&&hand?.from==='director'&&hand.ref?.key!=null&&layers.length)writeBack()},
 onLook:(l,s2)=>{look=l;str=s2},
 onElement:e=>{if(e.kind==='cast')select(e.id);else apply('place',e.n.toLowerCase())}});
renderLayers();
</script></body></html>
