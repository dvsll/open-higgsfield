<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--col:#141416;--card:#1a1a1d;--line:#26262a;--txt:#ececef;--dim:#8b8b93;--faint:#5a5a62;--acc:#e8e3d9;--sel:#7aa2ff;--ok:#5bbf8a}
*{box-sizing:border-box;border-radius:0!important}html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}header.studio-header{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;min-height:44px}header a{color:var(--dim);text-decoration:none}header h1{font-size:14px;font-weight:600;margin:0}header #src{color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}header .sp{flex:1}
.studio-header button{font:inherit;font-size:12px;min-height:28px;background:#20232a;border:1px solid #3a404b;padding:4px 8px;color:var(--txt);cursor:pointer}.studio-header button:focus-visible{outline:2px solid #e9c46a;outline-offset:2px}
.app{flex:1;min-height:0;min-width:0;overflow:hidden}main,aside{min-height:0;min-width:0;overscroll-behavior:contain}.pill{border:1px solid var(--line);padding:6px 12px;cursor:pointer;background:#22262d}.pill.solid{background:#e9c46a;color:#211b10}.pill:disabled{opacity:.4;cursor:default}
</style></head><body><div id="studio-root"></div><script type="module" src="./src/react/edit-app.tsx"></script></body></html>
