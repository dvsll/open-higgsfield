<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keyframes Mockup</title><link rel="stylesheet" href="kit.css"><style>
.tlw{background:var(--panel);border-top:1px solid var(--edge);padding:10px 14px 14px;user-select:none}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ruler{position:relative;height:18px;margin-left:70px;color:var(--dim);font-size:11px}.ruler span{position:absolute;transform:translateX(-50%)}
.track{display:flex;align-items:center;height:64px;border-top:1px solid var(--edge)}
.track>b{width:70px;color:var(--dim);font-weight:500;font-size:12px}
.lane{position:relative;flex:1;height:100%}
.key{position:absolute;top:6px;width:84px;height:52px;margin-left:-42px;border-radius:6px;overflow:hidden;border:2px solid var(--edge);cursor:grab;background:#000;touch-action:none}
.key.sel{border-color:var(--hi)}.key canvas{width:100%;height:100%;display:block}
.key.pr{background:var(--panel2);font-size:11px;padding:4px;color:var(--txt);line-height:1.2}
.key::before{content:"";position:absolute;left:50%;bottom:-2px;width:8px;height:8px;margin-left:-4px;background:var(--warm);transform:rotate(45deg)}
.ph{position:absolute;top:-18px;bottom:0;width:2px;background:var(--bad);margin-left:-1px;pointer-events:none;z-index:2}
.lanes{position:relative}
.seg{position:absolute;top:30px;height:3px;background:repeating-linear-gradient(90deg,var(--hi) 0 6px,transparent 6px 10px);opacity:.6}
</style></head><body>
<div class="bar"><a class="back" href="../index.html">←</a><span class="brand">◆ Keyframes</span><span class="note">mockup — in-betweens are crossfades here; LTX would generate real motion</span>
<div class="nav"><button class="on">Edit</button><button id="exp">Export</button></div></div>
<div class="body">
 <div class="side">
  <div class="h">Bin</div>
  <button class="t" id="addImg">＋ Image key at playhead</button>
  <button class="t" id="addPr">＋ Prompt key at playhead</button>
  <div class="note" style="margin-top:6px">Drag keys along the timeline. Click one to edit it. Space = play.</div>
  <div class="h">Images</div>
  <div id="bin" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
 </div>
 <div class="stage" id="stage"><div class="vid"><canvas id="pv"></canvas><span class="lbl" style="left:10px" id="pvl"></span></div></div>
 <div class="side r">
  <div class="h">Key @ <span id="kt">—</span></div>
  <div id="insp"><div class="note">Select a key.</div></div>
 </div>
</div>
<div class="tlw">
 <div class="ctl"><button class="btng" id="play">▶</button><span id="tc" class="note">00:00.0</span><span class="note" style="margin-left:auto">8 s · 24 fps · LTX-2.5 multi-keyframe conditioning</span></div>
 <div class="lanes" id="lanes"><div class="ruler" id="ruler"></div>
  <div class="track"><b>Images</b><div class="lane" id="L0"></div></div>
  <div class="track"><b>Prompts</b><div class="lane" id="L1"></div></div>
  <div class="ph" id="ph"></div></div>
</div>
<script src="kit.js"></script><script>
const {$,$$,LOOKS}=K,DUR=8;
let keys=[{t:0,kind:'img',look:'day',label:'field.png',motion:'',str:1},{t:4,kind:'img',look:'golden',label:'sunset.png',motion:'camera drifts right, wind picks up',str:.9},{t:8,kind:'img',look:'neon',label:'city.png',motion:'lights flicker on block by block',str:1},
 {t:1,kind:'pr',text:'calm field'},{t:6,kind:'pr',text:'neon city takes over'}],sel=keys[1],ph=2,playing=false,rendered=false;
const BIN=['day','golden','night','snow','neon','pastel','mars','noir'];
$('#ruler').innerHTML=[...Array(DUR+1)].map((_,i)=>`<span style="left:${i/DUR*100}%">${i}s</span>`).join('');
BIN.forEach(l=>{const c=document.createElement('canvas');c.width=160;c.height=90;c.style.cssText='width:100%;border-radius:4px;cursor:pointer';c.title='Click to add at playhead';K.paint(c.getContext('2d'),{...LOOKS[l],people:0},2);c.onclick=()=>addKey({kind:'img',look:l,label:l+'.png',motion:'',str:1});$('#bin').append(c)});
function addKey(k){k.t=+ph.toFixed(1);keys.push(k);sel=k;rendered=false;draw()}
$('#addImg').onclick=()=>addKey({kind:'img',look:BIN[Math.random()*BIN.length|0],label:'upload.png',motion:'',str:1});
$('#addPr').onclick=()=>addKey({kind:'pr',text:'describe what happens here'});
function draw(){['L0','L1'].forEach(id=>$('#'+id).innerHTML='');
 const imgs=keys.filter(k=>k.kind==='img').sort((a,b)=>a.t-b.t);
 for(let i=0;i<imgs.length-1;i++){const s=document.createElement('div');s.className='seg';s.style.left=imgs[i].t/DUR*100+'%';s.style.width=(imgs[i+1].t-imgs[i].t)/DUR*100+'%';$('#L0').append(s)}
 keys.forEach(k=>{const d=document.createElement('div');d.className='key'+(k.kind==='pr'?' pr':'')+(k===sel?' sel':'');d.style.left=k.t/DUR*100+'%';
  if(k.kind==='img'){d.innerHTML='<canvas width="120" height="74"></canvas>';K.paint(d.firstChild.getContext('2d'),{...LOOKS[k.look],people:0},2)}else d.textContent='“'+k.text+'”';
  d.onpointerdown=e=>{sel=k;d.setPointerCapture(e.pointerId);const lane=d.parentElement.getBoundingClientRect();let moved=false;
   d.onpointermove=ev=>{moved=true;k.t=Math.round(Math.min(DUR,Math.max(0,(ev.clientX-lane.left)/lane.width*DUR))*10)/10;d.style.left=k.t/DUR*100+'%';$('#kt').textContent=fmt(k.t)};
   d.onpointerup=()=>{d.onpointermove=null;if(moved)rendered=false;draw()};insp()};
  $(k.kind==='img'?'#L0':'#L1').append(d)});insp()}
const fmt=t=>`00:${t.toFixed(1).padStart(4,'0')}`;
function insp(){const k=sel;$('#kt').textContent=k?fmt(k.t):'—';if(!k){$('#insp').innerHTML='<div class="note">Select a key.</div>';return}
 $('#insp').innerHTML=k.kind==='img'?`<div class="item">🖼 ${k.label}</div><div class="h">Strength</div><input type="range" id="kS" min="0" max="100" value="${k.str*100}"><div class="h">Motion into this key</div><textarea class="inp" id="kM" placeholder="e.g. camera pushes in">${k.motion}</textarea><button class="btng" id="kD" style="margin-top:8px">Delete key</button>`
  :`<div class="h">Prompt from here on</div><textarea class="inp" id="kP">${k.text}</textarea><button class="btng" id="kD" style="margin-top:8px">Delete key</button>`;
 $('#kS')&&($('#kS').oninput=e=>{k.str=e.target.value/100;rendered=false});$('#kM')&&($('#kM').oninput=e=>{k.motion=e.target.value;rendered=false});$('#kP')&&($('#kP').oninput=e=>{k.text=e.target.value;rendered=false;draw();$('#kP').focus()});
 $('#kD').onclick=()=>{keys.splice(keys.indexOf(k),1);sel=null;rendered=false;draw()}}
// playhead
const lanes=$('#lanes');function setPh(x){const r=$('#L0').getBoundingClientRect();ph=Math.min(DUR,Math.max(0,(x-r.left)/r.width*DUR))}
$('#ruler').onpointerdown=e=>{setPh(e.clientX);$('#ruler').setPointerCapture(e.pointerId);$('#ruler').onpointermove=ev=>setPh(ev.clientX)};$('#ruler').onpointerup=()=>$('#ruler').onpointermove=null;
$('#ruler').style.cursor='ew-resize';
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'❚❚':'▶'};
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();$('#play').click()}});
$('#exp').onclick=async()=>{await K.render($('#stage'),['Packing keys as conditioning frames…','LTX-2.5 · generating 192 frames…','Decoding…'],2800);rendered=true;K.toast('Rendered — mock MP4 ready')};
// preview
const g=K.canvas($('#pv'),640,360),A=document.createElement('canvas'),B=document.createElement('canvas'),ga=K.canvas(A,640,360),gb=K.canvas(B,640,360);
let last=performance.now();
K.loop(t=>{const now=performance.now();if(playing){ph=(ph+(now-last)/1000)%DUR}last=now;
 $('#ph').style.left=`calc(70px + (100% - 70px) * ${ph/DUR})`;$('#tc').textContent=fmt(ph);
 const imgs=keys.filter(k=>k.kind==='img').sort((a,b)=>a.t-b.t);if(!imgs.length){g.fillStyle='#111';g.fillRect(0,0,640,360);return}
 let a=imgs[0],b=imgs[0];for(const k of imgs){if(k.t<=ph)a=k;if(k.t>=ph){b=k;break}}if(ph>imgs[imgs.length-1].t)b=a=imgs[imgs.length-1];
 const span=b.t-a.t,u=span?(ph-a.t)/span:0,e=u*u*(3-2*u),drift=/right/.test(b.motion)?e*40:/left/.test(b.motion)?-e*40:e*10;
 const pr=keys.filter(k=>k.kind==='pr'&&k.t<=ph).sort((x,y)=>y.t-x.t)[0];
 ga.save();ga.translate(-drift,0);K.paint(ga,{...LOOKS[a.look],people:1},t);ga.restore();gb.save();gb.translate(-drift+40*(1-e),0);K.paint(gb,{...LOOKS[b.look],people:1},t);gb.restore();
 g.globalAlpha=1;g.drawImage(A,0,0);g.globalAlpha=e*b.str;g.drawImage(B,0,0);g.globalAlpha=1;
 $('#pvl').textContent=(rendered?'Render':'Preview')+` · ${fmt(ph)}`+(span&&u>0&&u<1?' (interpolated)':' (key)')+(pr?` · “${pr.text}”`:'')});
draw();
</script></body></html>
