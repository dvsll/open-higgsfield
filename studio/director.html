<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Director Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--col:#141416;--card:#1a1a1d;--line:#26262a;--txt:#ececef;--dim:#8b8b93;--faint:#5a5a62;--acc:#e8e3d9;--key:#d9a441;--ok:#5bbf8a;--clip:#1d2230;--clipOn:#26304a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 Inter,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
header a{color:var(--faint);text-decoration:none}header h1{font-size:14px;font-weight:600;margin:0}header .proj{color:var(--dim)}header .sp{flex:1}
.pill{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--txt)}
.pill:hover{border-color:var(--faint)}.pill.solid{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}.pill:disabled{opacity:.4;cursor:default}
.app{display:grid;grid-template-columns:250px 1fr 290px;min-height:0}
aside{background:var(--col);overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line)}
.sec{font-size:11px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:8px}
.sec span{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--faint);text-align:right}
.mood{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pin{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:4/5;border:1px solid transparent}
.pin.on{border-color:var(--acc)}.pin canvas{width:100%;height:100%;display:block}
.pin i{position:absolute;left:6px;bottom:6px;font-style:normal;font-size:11px;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:99px}
.swatches{display:flex;gap:6px}.swatches b{flex:1;height:20px;border-radius:5px}
.cast{display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;background:var(--card)}
.who .av{width:30px;height:30px;border-radius:6px;background:#2a2a2e;display:grid;place-items:center;font-size:16px}
.who small{display:block;color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--acc)}
main{display:flex;flex-direction:column;min-width:0;padding:16px 22px;gap:12px;overflow:auto}
.title{display:flex;align-items:baseline;gap:10px}.title h2{margin:0;font-size:18px;font-weight:600}.title span{color:var(--dim)}.title .sp{flex:1}
.view{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-height:48vh;align-self:center;flex:none}
.view canvas{width:100%;height:100%;display:block}
.view .tag{position:absolute;left:12px;top:12px;font-size:11px;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:99px;color:#ddd}
.view .tc{position:absolute;right:12px;bottom:10px;font:12px ui-monospace,Consolas,monospace;color:#ddd;text-shadow:0 1px 3px #000}
.row{display:flex;gap:10px;align-items:stretch}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;flex:none;align-self:center}
textarea{width:100%;background:var(--col);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font:inherit;outline:none;resize:none}
textarea:focus{border-color:var(--faint)}
.tlw{background:var(--col);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;user-select:none}
.tlh{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);margin-bottom:4px}
.tlh .sp{flex:1}.tlh .hint{color:var(--faint)}.tlh button{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--dim)}
.tl{position:relative}
.ruler{position:relative;height:16px;font-size:10px;color:var(--faint);cursor:ew-resize}.ruler span{position:absolute;transform:translateX(-50%)}
.trk{position:relative;display:flex;height:80px;margin-top:4px}
.trk.scene{height:96px}
.clip{position:relative;height:100%;border-radius:7px;background:var(--clip);border:1px solid #2c3550;margin-right:3px;cursor:pointer;flex:none;overflow:hidden}
.clip.on{border-color:#5a6fa8}.clip.drop{border-color:var(--key);border-style:dashed}
.clip .strip{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trk.scene .clip .strip{opacity:.35}
.clip .lbl{position:absolute;left:0;right:0;top:0;padding:4px 6px;font-size:11px;color:#e4e8f2;white-space:nowrap;overflow:hidden;display:flex;gap:6px;align-items:center;background:linear-gradient(rgba(10,12,20,.85),rgba(10,12,20,0));pointer-events:none}
.clip .lbl i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}.clip .lbl i.ok{background:var(--ok)}
.tw{pointer-events:auto;border:0;background:rgba(0,0,0,.4);color:#fff;height:18px;border-radius:4px;cursor:pointer;font-size:10px;padding:0 6px;flex:none}
.tw:hover{background:rgba(255,255,255,.22)}
.clip .grip{position:absolute;right:-2px;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}.clip .grip:hover{background:rgba(255,255,255,.15)}
.addclip{flex:none;width:44px;height:100%;border:1px dashed var(--line);border-radius:7px;background:none;color:var(--faint);cursor:pointer}
.k{position:absolute;top:30px;width:80px;height:48px;margin-left:-40px;border-radius:5px;overflow:hidden;border:2px solid #3a4462;cursor:grab;background:#000;touch-action:none;z-index:2}
.k.on{border-color:var(--key)}.k canvas{width:100%;height:100%;display:block}
.k::after{content:"";position:absolute;left:50%;bottom:-1px;width:6px;height:6px;margin-left:-3px;background:var(--key);transform:rotate(45deg)}
.clip .act{display:none;margin-left:auto;gap:3px}.clip:hover .act{display:flex}
.clip .act button{pointer-events:auto;border:0;background:rgba(0,0,0,.45);color:#fff;height:18px;min-width:18px;cursor:pointer;font-size:10px;padding:0 5px}
.clip .act button:hover{background:rgba(255,255,255,.25)}
.clip.dragging{opacity:.4}.trk.dropzone{outline:1px dashed var(--key);outline-offset:2px}
.stash{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #1f1f23;min-height:44px}
.stash .sl{font-size:11px;color:var(--dim);width:58px;flex:none}
.stash .items{display:flex;gap:6px;overflow-x:auto;flex:1}
.stash .it{position:relative;flex:none;width:96px;height:40px;border:1px solid #2c3550;background:#000;cursor:grab;overflow:hidden}
.stash .it canvas{width:100%;height:100%;display:block;opacity:.75}
.stash .it span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:1px 4px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden}
.stash .it button{position:absolute;right:0;top:0;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;cursor:pointer;display:none;padding:1px 4px}.stash .it:hover button{display:block}
.stash .none{font-size:11px;color:var(--faint)}
.stash.drop{background:rgba(217,164,65,.06)}
.trashb{background:none;border:0!important;color:var(--faint)!important;font-size:11px;cursor:pointer;padding:2px 4px!important}
.trashb:hover{color:var(--dim)!important}
.trashpop{position:absolute;right:10px;bottom:calc(100% + 6px);width:280px;background:var(--card);border:1px solid var(--line);padding:8px;z-index:30;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.trashpop .tr{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:12px;border-bottom:1px solid #1f1f23}
.trashpop .tr canvas{width:48px;height:27px;flex:none;opacity:.6}.trashpop .tr small{color:var(--faint);display:block}
.trashpop .tr button,.trashpop .foot button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);font-size:11px;cursor:pointer;padding:2px 8px}
.trashpop .foot{display:flex;justify-content:space-between;align-items:center;padding-top:6px;font-size:11px;color:var(--faint)}
.tlw{position:relative}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}.crumb a{color:var(--dim);cursor:pointer;text-decoration:none}.crumb a:hover{color:var(--txt)}.crumb b{color:var(--txt);font-weight:500}
.gph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);margin-left:-1px;pointer-events:none;z-index:5}
.gph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--dim);font-size:12px}
.chip.on{border-color:var(--acc);color:var(--txt);background:#1f1f22}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gen .v{position:relative;border-radius:8px;overflow:hidden;cursor:grab;border:1px solid var(--line);aspect-ratio:16/9;background:#000}
.gen .v:hover{border-color:var(--acc)}.gen canvas{width:100%;height:100%;display:block;pointer-events:none}
.gen .v span{position:absolute;right:5px;bottom:5px;border-radius:99px;background:rgba(0,0,0,.65);padding:2px 8px;font-size:11px;opacity:0;transition:opacity .15s;pointer-events:none}
.gen .v:hover span{opacity:1}
.empty{color:var(--faint);font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center}
.ov{position:absolute;inset:0;background:rgba(10,10,12,.78);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9}
.prog{width:50%;height:3px;background:#333;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc)}
.rt{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 10px}.rt.on{color:var(--ok);border-color:#2f5a44}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.gen .v.busy{display:grid;place-items:center;color:var(--faint);font-size:12px}
.empty{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 40% 45%,rgba(14,14,16,.72),rgba(14,14,16,.92));z-index:2}
.empty .msg{position:absolute;left:8%;top:30%;max-width:46%}
.empty h3{color:var(--txt);margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.01em}.empty p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.empty .arw{position:absolute;right:56px;bottom:-12px;width:56px;height:64px;pointer-events:none;overflow:visible;fill:none;stroke:#e8e3d9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
.view{overflow:visible!important}.view>canvas,.view>video{border-radius:12px}
.empty{border-radius:12px}
#gen.nudge{box-shadow:0 0 0 0 rgba(232,227,217,.55);animation:nudge 1.6s infinite}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(232,227,217,.5)}70%{box-shadow:0 0 0 12px rgba(232,227,217,0)}100%{box-shadow:0 0 0 0 rgba(232,227,217,0)}}
#sName{outline:none;border-bottom:1px dashed transparent;cursor:text;min-width:2ch;display:inline-block}#sName:hover{border-bottom-color:var(--faint)}#sName:focus{border-bottom-color:var(--acc)}
#sTitle .pen{font-size:12px;color:var(--faint);margin-left:6px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;transition:opacity .3s;z-index:20}
@media (max-width:1000px){.app{grid-template-columns:1fr}aside.l,aside.r{border:0;border-top:1px solid var(--line)}aside.l{order:2}main{order:1}aside.r{order:3}}
/* No rounded corners anywhere for now (overrides shell.js styles too). */
*,*::before,*::after{border-radius:0!important}
</style></head><body>
<header><a href="../index.html">←</a><h1>Director</h1><span class="proj">/ The Robot in the Junkyard</span><span class="sp"></span>
 <span id="rt" class="rt" title="Local runtime: shared/runtime/serve.py → comfy-sdk → ComfyUI">○ placeholders</span>
 <button class="pill" id="genAll">Generate all shots</button></header>
<div class="app">
 <aside class="l" id="shared"></aside>
 <main>

  <div class="view"><canvas id="cv"></canvas><video id="vid" muted playsinline preload="auto"></video>
   <div class="empty" id="empty"><div class="msg"><h3 id="emT">Not generated yet</h3><p id="emP"></p></div>
    <svg class="arw" viewBox="0 0 64 72" aria-hidden="true"><path d="M6,6 C34,8 50,26 49,60" /><path d="M41,52 L49,63 L57,52" /></svg></div><span class="tag" id="tag"></span><span class="tc" id="tc"></span>
   <div class="ov" id="ov"><div id="ovt"></div><div class="prog"><i id="pb"></i></div></div></div>
  <div class="row">

   <button class="pill solid" id="gen" style="white-space:nowrap;padding:0 18px">Generate shot</button>
  </div>
  <div class="tlw">
   <div class="tlh"><span class="crumb" id="crumb"></span><span id="tot"></span><span class="sp"></span><span class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0"><span id="hintT"></span></span><button id="trashBtn" class="trashb" title="Deleted shots (restorable)"></button><button id="addKeyBtn" title="Add a keyframe at the playhead (copies the nearest one)">＋ Keyframe</button><button id="editKey" title="Open the selected keyframe in Edit Anything">✎ Edit keyframe</button><button id="delKey">Remove key</button></div>
   <div class="tl" id="tl"><div class="ruler" id="ruler"></div><div class="trk" id="trk"></div><div class="gph" id="gph"></div></div>
   <div class="stash" id="stash"></div><div class="trashpop" id="trashpop"></div>
  </div>
 </main>
 <aside class="r">
  <div class="sec">Generate keyframe</div>
  <textarea id="kp" rows="3">Mia holds Bolt up to the window, first light on his face</textarea>
  <div class="sec">Elements</div>
  <div class="chips" id="els"></div>
  <div class="sec">Framing</div>
  <div class="chips" id="frm"></div>
  <div style="color:var(--faint);font-size:12px">Look: <span id="lookUse"></span>, from the mood board</div>
  <button class="pill solid" id="kgo" style="width:100%">Generate 4 keyframes</button>
  <div class="sec">Results <span>click = add at playhead<br>or drag onto a clip</span></div>
  <div id="res"><div class="empty">Generated keyframes show up here.</div></div>
 </aside>
</div>
<script src="../shared/lib/kit.js"></script><script src="../shared/styleboard/looks.js"></script><script src="scene.js"></script><script src="shell.js"></script><script src="../shared/runtime/client.js"></script><script>
const {$,$$}=K,W=640,H=360;
// ---------- data ----------
const LOOKS=SC.LOOKS;
let look=LOOKS[0],str=.8;
const SP=SC.SP;
const SH=[{n:'Wide',d:4,spec:SP({scene:'yard',scale:.6}),m:'slow push toward Mia as she spots Bolt in the scrap'},
 {n:'Close',d:3,spec:SP({scene:'yard',scale:2.6,mia:false}),m:'her hand brushes the dust off Bolt\'s face'},
 {n:'Medium',d:4,spec:SP({scene:'street',scale:1.3,carry:true}),m:'she shifts Bolt to her other arm, streetlights flicker on'},
 {n:'Insert',d:3,spec:SP({scene:'room',scale:1.6,night:true}),m:'tools glint under the desk lamp'},
 {n:'Close',d:4,spec:SP({scene:'room',scale:2.4,mia:false,eyes:true}),m:'Bolt\'s eyes flicker, then glow'}];
SH.forEach(s=>{s.r=false;s.keys=[{t:0,u:0,spec:s.spec},{t:+(s.d*.75).toFixed(1),u:1,spec:s.spec}]});
// Restore state (survives the round trip to Edit Anything).
const saved=SC.get('osh-director');if(saved&&saved.SH){SH.length=0;saved.SH.forEach(x=>SH.push(x));}
let STASH=saved?.STASH||[],TRASH=saved?.TRASH||[];
function save(){SC.set('osh-director',{SH,cur,G,STASH,TRASH})}
let cur=saved?.cur||0,selKey=null,G=saved?.G||0,playing=false,pxs=1,results=[],dragV=null;
const tot=()=>SH.reduce((a,s)=>a+s.d,0),start=i=>SH.slice(0,i).reduce((a,s)=>a+s.d,0);
function at(g){let a=0;for(let i=0;i<SH.length;i++){if(g<a+SH[i].d||i===SH.length-1)return[i,Math.min(SH[i].d,g-a)];a+=SH[i].d}}
// ---------- drawing ----------
const frame=(g)=>SC.blank(g),mute=SC.mute;
const off=document.createElement('canvas'),og=K.canvas(off,W,H);
// A shot plays by easing between its keyframes; different keyframe images cross-dissolve.
// Real keyframe images (from the local runtime) are drawn instead of the placeholder spec.
const IMG={};function img(url){if(!url)return null;let im=IMG[url];if(!im){im=IMG[url]=new Image();im.onload=()=>{clearTimeout(img.t);img.t=setTimeout(()=>{timeline();res()},50)};im.src=url}return im.complete&&im.naturalWidth?im:null}
function cover(g,im,z=1){const W=g.canvas.width,H=g.canvas.height,r=Math.max(W/im.naturalWidth,H/im.naturalHeight)*z,w=im.naturalWidth*r,h=im.naturalHeight*r;g.drawImage(im,(W-w)/2,(H-h)/2,w,h)}
function drawKey(g,k,t,u){const im=img(k.img);if(im)cover(g,im,1+(u||0)*.04);else frame(g,k.spec,t,u??k.u)}
function shotFrame(g,s,lt,t){const k=[...s.keys].sort((a,b)=>a.t-b.t);if(!k.length){g.fillStyle='#111';g.fillRect(0,0,g.canvas.width,g.canvas.height);g.fillStyle='#666';g.font='16px Inter,system-ui';g.textAlign='center';g.fillText('Empty shot — add keyframes',g.canvas.width/2,g.canvas.height/2);g.textAlign='left';return}
 let a=k[0],b=k[0];if(lt>=k[k.length-1].t)a=b=k[k.length-1];else if(lt>k[0].t)for(let i=0;i<k.length-1;i++)if(lt<=k[i+1].t){a=k[i];b=k[i+1];break}
 const v=a===b?0:(lt-a.t)/((b.t-a.t)||1),e=v*v*(3-2*v);
 if(!a.img&&!b.img&&SC.same(a.spec,b.spec))frame(g,a.spec,t,a.u+(b.u-a.u)*e);else{drawKey(g,a,t,a.img?v:a.u);if(e>0){drawKey(og,b,t,b.img?v:b.u);g.globalAlpha=e;g.drawImage(off,0,0,g.canvas.width,g.canvas.height);g.globalAlpha=1}}}
// ---------- sequence timeline ----------
// After Effects-style: in the sequence every shot is just a video clip. Open one (double-click / "Open")
// and the timeline becomes that shot alone: it loops by itself and shows only its keyframes.
let open=null;
function openShot(i){open=i;cur=i;selKey=null;G=start(i);timeline();head()}
function closeShot(){const i=open;open=null;selKey=null;if(i!=null)G=start(i);timeline();head()}
function timeline(){stashUI();const trk=$('#trk'),W0=$('#tl').clientWidth;$('#addKeyBtn').style.display=open==null?'none':'';trk.innerHTML='';trk.classList.toggle('scene',open!=null);
 if(open!=null&&!SH[open])open=null;
 if(open==null){ // ---- sequence: shots act as videos
  const T=tot();pxs=(W0-50)/T;$('#tot').textContent=`${SH.length} shots · ${T}s`;$('#crumb').innerHTML='<b>Sequence</b>';
  $('#hintT').textContent='double-click a shot to open it · drag a clip edge to trim';
  $('#ruler').innerHTML=[...Array(T+1)].map((_,k)=>`<span style="left:${k*pxs}px">${k}s</span>`).join('');
  SH.forEach((s,i)=>{const c=document.createElement('div');c.className='clip'+(i===cur?' on':'');c.style.width=(s.d*pxs-3)+'px';
   c.innerHTML=`<canvas class="strip" width="${Math.max(10,s.d*pxs|0)}" height="80"></canvas><span class="lbl"><i class="${s.r?'ok':''}"></i>${i+1} · ${s.n} · ${s.d}s<span class="act"><button class="tw" title="Open this shot">Open ▸</button><button data-a="stash" title="Move to stash">⇣</button><button data-a="del" title="Delete (goes to trash)">✕</button></span></span><div class="grip" title="Drag to trim"></div>`;
   strip(c,s);
   c.querySelector('.tw').onclick=ev=>{ev.stopPropagation();openShot(i)};
   c.querySelector('[data-a=stash]').onclick=ev=>{ev.stopPropagation();removeShot(i,'stash')};
   c.querySelector('[data-a=del]').onclick=ev=>{ev.stopPropagation();removeShot(i,'trash')};
   c.draggable=true;c.ondragstart=ev=>{dragShot={from:'seq',i};c.classList.add('dragging');ev.dataTransfer.setData('text/plain','shot')};c.ondragend=()=>{dragShot=null;c.classList.remove('dragging')};
   c.onclick=ev=>{if(ev.target.closest('.grip,.tw,.act'))return;cur=i;selKey=null;const r=c.getBoundingClientRect();G=start(i)+Math.max(0,Math.min(s.d-.01,(ev.clientX-r.left)/pxs));timeline();head()};

 onLook:(l,s2,commit)=>{look=l;str=s2;$('#lookUse').textContent=l.n;if(commit){SH.forEach(x=>x.r=false);timeline();head();res()}},
 onElement:e=>{const c=$(`#els [data-k=${e.id}]`);c.click();markEls();toast(`${e.n} ${c.classList.contains('on')?'added to':'removed from'} the keyframe prompt`)}});
function markEls(){SHELL.mark($$('#els .chip.on').map(c=>c.dataset.k))}
$('#els').addEventListener('click',()=>setTimeout(markEls));
OSH.health().then(({online})=>{const b=$('#rt');b.classList.toggle('on',online);b.textContent=online?'● local ComfyUI':'○ placeholders';if(!online)b.title='Start shared/runtime/serve.py with ComfyUI running for real generation'});
timeline();head();markEls();if(!playing)$('#play').textContent='▶';
</script></body></html>
