<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFX Plate Kit Mockup</title><link rel="stylesheet" href="kit.css"><style>
.layer{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;background:var(--panel2);border:1px solid transparent;cursor:pointer}
.layer.sel{border-color:var(--hi)}.layer .tg{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--edge);color:var(--dim)}
.layer.off{opacity:.45}.layer .eye{background:none;border:0;cursor:pointer;font-size:14px;color:var(--txt)}
.passes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:900px}
.pass{cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden;position:relative}.pass.on{border-color:var(--hi)}
.pass canvas{width:100%;display:block}.pass span{position:absolute;left:4px;bottom:3px;font-size:11px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:3px}
</style></head><body>
<div class="bar"><a class="back" href="../index.html">←</a><span class="brand">▦ VFX Plate Kit</span><span class="note">mockup — passes faked in-browser</span></div>
<div class="body">
 <div class="side">
  <div class="h">Layers (top → bottom)</div>
  <div id="layers" style="display:flex;flex-direction:column;gap:5px"></div>
  <button class="btng" onclick="K.toast('Only adapters that exist: Water Sim, Day to Night, Alpha Gen, Clean Plate')">＋ Add layer</button>
 </div>
 <div class="stage" id="stage">
  <div class="vid"><canvas id="big"></canvas><span class="lbl" style="left:10px" id="bl"></span></div>
  <div class="passes" id="passes"></div>
 </div>
 <div class="side r">
  <div class="h" id="ph">Layer settings</div><div id="params"></div>
  <label class="item" style="margin-top:10px"><input type="checkbox" id="keepFg" checked> Comp people back over the effect (uses matte)</label>
  <button class="btnp" id="go" style="margin-top:10px">Render stack · ~6 min</button>
  <button class="btng" id="exp" style="margin-top:6px">Export matte + plate (for AE/Nuke)</button>
  <div class="note">Each layer is an LTX-2.5 IC-LoRA pass. Alpha Gen is beta.</div>
 </div>
</div>
<script src="kit.js"></script><script>
const {$,$$}=K,W=640,H=360;
const L=[{id:'water',ic:'🌊',n:'Water Simulation',tg:'fx',on:true,p:{level:55,turb:40}},{id:'night',ic:'🌙',n:'Day to Night',tg:'fx',on:false,p:{amount:100}},{id:'alpha',ic:'◐',n:'Alpha Gen (beta)',tg:'matte',on:true,p:{edge:50}},{id:'clean',ic:'🧽',n:'Clean Plate',tg:'base',on:true,p:{}},{id:'src',ic:'🎞',n:'Source clip',tg:'',on:true,p:{}}];
let selL=L[0],view='final',rendered=false;
const PASSES=[['src','Source'],['clean','Clean plate'],['matte','Matte'],['final','Final']];
const big=K.canvas($('#big'),W,H),pc={};
PASSES.forEach(([k,n])=>{const d=document.createElement('div');d.className='pass'+(k===view?' on':'');d.innerHTML=`<canvas></canvas><span>${n}</span>`;pc[k]=K.canvas(d.firstChild,320,180);d.onclick=()=>{view=k;$$('.pass').forEach(x=>x.classList.toggle('on',x===d))};$('#passes').append(d)});
const on=id=>L.find(l=>l.id===id).on;
function layers(){$('#layers').innerHTML='';L.forEach(l=>{const d=document.createElement('div');d.className='layer'+(l===selL?' sel':'')+(l.on?'':' off');d.innerHTML=`<button class="eye" title="toggle">${l.on?'👁':'—'}</button>${l.ic} ${l.n}<span class="tg">${l.on?l.tg||'base':'off'}</span>`;
 d.onclick=()=>{selL=l;layers();params()};d.querySelector('.eye').onclick=e=>{e.stopPropagation();if(l.id==='src')return;l.on=!l.on;rendered=false;layers()};$('#layers').append(d)})}
function params(){$('#ph').textContent=selL.n;const p=selL.p;$('#params').innerHTML=Object.keys(p).length?Object.keys(p).map(k=>`<div class="h">${k}</div><input type="range" data-k="${k}" min="0" max="100" value="${p[k]}">`).join(''):'<div class="note">No settings.</div>';
 $$('#params input').forEach(i=>i.oninput=()=>{p[i.dataset.k]=+i.value;rendered=false})}
function walkers(g,t,s,col){for(let i=0;i<3;i++)K.walker(g,((t*.1+i*.37)%1.15-.07)*g.canvas.width,g.canvas.height*(.78+i*.05),s*(1+i*.12),1,col||['#d24b3c','#2a9d8f','#e9c46a'][i])}
function draw(g,k,t){const W=g.canvas.width,H=g.canvas.height,s=Math.min(W,H)/360;
 const night=on('night')?L[1].p.amount/100:0,wl=on('water')?L[0].p.level/100:0;
 if(k==='matte'){g.fillStyle='#000';g.fillRect(0,0,W,H);if(on('alpha')){const o=document.createElement('canvas');o.width=W;o.height=H;const og=o.getContext('2d');walkers(og,t,s);og.globalCompositeOperation='source-in';og.fillStyle='#fff';og.fillRect(0,0,W,H);g.filter=`blur(${(100-L[2].p.edge)/40}px)`;g.drawImage(o,0,0);g.filter='none'}else{g.fillStyle='#555';g.font=14*s+'px system-ui';g.fillText('Alpha Gen off',W/2-50*s,H/2)}return}
 const base=k==='src'||!on('clean');
 const o=k==='final'&&night?{...K.LOOKS.night,light:1-.55*night}:{};
 K.paint(g,{...o,people:0,water:k==='final'?wl*.9:0,turb:L[0].p.turb/25+.2,extra:(g)=>{if(base)walkers(g,t,s)}},t);
 if(k==='final'&&on('clean')&&$('#keepFg').checked&&on('alpha'))walkers(g,t,s);}
$('#go').onclick=async()=>{await K.render($('#stage'),L.filter(l=>l.on&&l.id!=='src').reverse().map(l=>`Pass: ${l.n}…`),3000);rendered=true;K.toast('Stack rendered')};
$('#exp').onclick=()=>K.toast(rendered?'mock: plate.mov + matte.mov + final.mov':'Render the stack first');
$('#keepFg').onchange=()=>rendered=false;
K.loop(t=>{PASSES.forEach(([k])=>draw(pc[k],k,t));draw(big,view,t);$('#bl').textContent=PASSES.find(p=>p[0]===view)[1]+(view==='final'?(rendered?' · rendered':' · preview'):'')});
layers();params();
</script></body></html>
