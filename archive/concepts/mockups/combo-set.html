<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set Combo Mockup</title><link rel="stylesheet" href="kit.css"><style>
.starts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:860px}
.start{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px;cursor:pointer;text-align:left;color:var(--txt);font:inherit}
.start:hover{border-color:var(--hi)}.start b{display:block;font-size:16px;margin:6px 0}.start .ic{font-size:28px}
#vp{position:relative;flex:1;min-height:0;width:100%}#vp canvas{display:block}
.stage.vpm{padding:0}
.tl{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-top:1px solid var(--edge);width:100%}
@media (max-width:800px){.starts{grid-template-columns:1fr}}
</style></head><body>
<div class="bar"><a class="back" href="../index.html">←</a><span class="brand">▣ Set</span><span class="note">combo A · Blockout + Drop-in 3D + Video→3D · renders faked</span>
<div class="nav"><button data-s="start" class="on">1 Start</button><button data-s="dress">2 Dress & shoot</button><button data-s="result">3 Result</button></div></div>
<div class="body">
 <div class="side hidden" id="left">
  <div class="h">Shapes</div><button class="t" data-add="box">■ Box</button><button class="t" data-add="sph">● Sphere</button>
  <div class="h">My models</div><button class="t" data-add="robot">🤖 robot.glb</button><button class="t" data-add="sneaker">👟 sneaker.glb</button>
  <button class="t" onclick="K.toast('mock: GLB upload')">＋ Upload GLB</button>
  <div class="h">In the set</div><div id="out" style="display:flex;flex-direction:column;gap:3px"></div>
 </div>
 <div class="stage" id="stage">
  <div data-p="start" class="starts">
   <button class="start" data-start="block"><span class="ic">▣</span><b>Block from scratch</b><span class="note">Grey shapes, empty grid</span></button>
   <button class="start" data-start="scan"><span class="ic">◎</span><b>Scan a real place</b><span class="note">Phone walk-around → point cloud</span></button>
   <button class="start" data-start="clip"><span class="ic">🎞</span><b>Use a clip</b><span class="note">Locked-off footage as the backplate</span></button>
  </div>
  <div data-p="dress result" class="hidden" style="width:100%;flex:1;display:flex;flex-direction:column;min-height:0">
   <div id="vp"><span class="lbl" style="left:10px;top:10px;bottom:auto" id="vpl"></span></div>
   <div class="tl"><button class="btng" id="play">▶ camera</button><span class="note" id="info">Drag to orbit · click to select · arrows move</span></div>
  </div>
 </div>
 <div class="side r hidden" id="right">
  <div data-p="dress">
   <div class="h">Direct (local LLM)</div>
   <div class="msgs" id="msgs" style="max-height:160px"><div class="msg">Try “put the robot on the box, slow orbit around it”</div></div>
   <input class="inp" id="ask" placeholder="Tell the set what to do… ⏎">
   <div class="h">Look</div><textarea class="inp" id="look">rainy backyard at dusk, robot rusted, cinematic</textarea>
   <button class="btnp" id="shoot" style="margin-top:8px;width:100%">Shoot · ~3 min</button>
  </div>
  <div data-p="result" class="hidden">
   <button class="btnp" style="width:100%" onclick="K.toast('mock: MP4')">Download</button>
   <button class="btng" style="width:100%;margin-top:6px" id="newAngle">New angle, same set</button>
   <button class="btng" style="width:100%;margin-top:6px" onclick="K.toast('mock: side-by-side card')">Side-by-side for posting</button>
  </div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kit.js"></script><script>
const {$,$$}=K,vp=$('#vp'),R=new THREE.WebGLRenderer({antialias:true});vp.prepend(R.domElement);
const scene=new THREE.Scene(),ed=new THREE.PerspectiveCamera(50,1,.1,300),shot=new THREE.PerspectiveCamera(40,1,.1,300);
const hemi=new THREE.HemisphereLight(0xffffff,0x444455,.8),sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(5,10,4);scene.add(hemi,sun);
const grid=new THREE.GridHelper(40,40,0x555866,0x3a3c46);scene.add(grid);
const grey=()=>new THREE.MeshStandardMaterial({color:0x9a9ca4,roughness:.9});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),grey());ground.rotation.x=-Math.PI/2;ground.material.color.set(0x5a5c63);scene.add(ground);
let objs=[],sel=null,mode='start',startKind='block',cloud=null,plate=null,orbit=false,playing=true,target=new THREE.Vector3(0,1,0);
function mk(kind){let o;if(kind==='box')o=new THREE.Mesh(new THREE.BoxGeometry(1.6,1,1.6),grey());else if(kind==='sph')o=new THREE.Mesh(new THREE.SphereGeometry(.6,24,16),grey());
 else if(kind==='robot'){o=new THREE.Group();const m=()=>new THREE.MeshStandardMaterial({color:0x8d949c,roughness:.6});const b=new THREE.Mesh(new THREE.BoxGeometry(.6,.7,.4),m()),h=new THREE.Mesh(new THREE.BoxGeometry(.5,.4,.4),m());b.position.y=.35;h.position.y=.95;const e=new THREE.Mesh(new THREE.BoxGeometry(.3,.08,.05),new THREE.MeshBasicMaterial({color:0x222222}));e.position.set(0,1,.21);o.add(b,h,e);o.userData.eyes=e}
 else{o=new THREE.Mesh(new THREE.BoxGeometry(.8,.3,.35),new THREE.MeshStandardMaterial({color:0xb8322a}))}
 o.userData.kind=kind;o.name=kind+'_'+(objs.filter(x=>x.userData.kind===kind).length+1);const box=new THREE.Box3().setFromObject(o);o.position.y=-box.min.y;scene.add(o);objs.push(o);return o}
function outl(){$('#out').innerHTML='';objs.forEach(o=>{const d=document.createElement('div');d.className='item'+(o===sel?' sel':'');d.textContent=o.name;d.onclick=()=>{sel=o;outl()};$('#out').append(d)});if(cloud){const d=document.createElement('div');d.className='item';d.textContent='◎ scan: backyard (412k pts)';$('#out').append(d)}}
$$('[data-add]').forEach(b=>b.onclick=()=>{sel=mk(b.dataset.add);sel.position.x=(Math.random()-.5)*4;sel.position.z=(Math.random()-.5)*3;outl()});
function makeCloud(){const P=[],C=[];const c=new THREE.Color();for(let i=0;i<16000;i++){let x,y,z;const k=Math.random();if(k<.5){x=(Math.random()-.5)*16;z=(Math.random()-.5)*16;y=0;c.set(0x4f7a3c)}else if(k<.8){x=(Math.random()-.5)*14;y=Math.random()*1.8;z=-6;c.set(0xc9b49a)}else{const t=Math.random()*6.28,p=Math.random()*3.14;x=5+1.5*Math.sin(p)*Math.cos(t);y=3+1.5*Math.cos(p);z=-3+1.5*Math.sin(p)*Math.sin(t);c.set(0x3e7a35)}P.push(x,y,z);C.push(c.r,c.g,c.b)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));return new THREE.Points(g,new THREE.PointsMaterial({size:.07,vertexColors:true}))}
function makePlate(){const c=document.createElement('canvas');c.width=640;c.height=360;K.paint(c.getContext('2d'),{people:0},2);const m=new THREE.Mesh(new THREE.PlaneGeometry(32,18),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));m.position.set(0,6,-10);return m}
$$('[data-start]').forEach(b=>b.onclick=()=>{startKind=b.dataset.start;objs.forEach(o=>scene.remove(o));objs=[];if(cloud)scene.remove(cloud),cloud=null;if(plate)scene.remove(plate),plate=null;
 if(startKind==='scan'){cloud=makeCloud();scene.add(cloud);ground.visible=false}else ground.visible=true;if(startKind==='clip'){plate=makePlate();scene.add(plate)}
 const bx=mk('box');bx.position.set(0,.5,0);const r=mk('robot');r.position.set(2.5,0,1);sel=r;outl();go('dress')});
// camera
let sph={th:.6,ph:1.05,r:14},drag=null;const cv=R.domElement;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:0}};addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;sph.th-=dx*.008;sph.ph=Math.max(.2,Math.min(1.5,sph.ph-dy*.008))});
addEventListener('pointerup',e=>{if(drag&&drag.m<4&&mode==='dress'&&e.target===cv){const b=cv.getBoundingClientRect(),r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1),ed);const h=r.intersectObjects(objs,true)[0];if(h){let o=h.object;while(!objs.includes(o))o=o.parent;sel=o;outl()}}drag=null});
cv.onwheel=e=>{e.preventDefault();sph.r=Math.max(4,Math.min(40,sph.r*(1+e.deltaY*.001)))};
addEventListener('keydown',e=>{if(!sel||/INPUT|TEXTAREA/.test(e.target.tagName))return;const d={ArrowLeft:[-.25,0],ArrowRight:[.25,0],ArrowUp:[0,-.25],ArrowDown:[0,.25]}[e.key];if(d){sel.position.x+=d[0];sel.position.z+=d[1];e.preventDefault()}});
$('#ask').onkeydown=async e=>{if(e.key!=='Enter'||!e.target.value.trim())return;const q=e.target.value.toLowerCase();K.say($('#msgs'),e.target.value,1);e.target.value='';await K.sleep(500);const done=[];
 const robot=objs.find(o=>o.userData.kind==='robot'),box=objs.find(o=>o.userData.kind==='box');
 if(/on (the )?box/.test(q)&&robot&&box){robot.position.set(box.position.x,box.position.y+.5,box.position.z);done.push('moved robot onto box_1');target.copy(robot.position).add(new THREE.Vector3(0,.6,0))}
 if(/orbit/.test(q)){orbit=true;done.push('set orbit camera (3 keys)')}if(/push|dolly/.test(q)){orbit=false;done.push('set push-in (2 keys)')}
 K.say($('#msgs'),done.length?done.join(', ')+' ✓':'Not sure — try “put the robot on the box” or “slow orbit”')};
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'❚❚ camera':'▶ camera'};
// result look
let wipeX=.5;function look(on){const n=/dusk|night/.test($('#look').value),rain=/rain/.test($('#look').value);scene.background=new THREE.Color(on?(n?0x2a2238:0x9cc3e6):0x24262d);scene.fog=on?new THREE.Fog(n?0x3a2a48:0xc8d8e8,6,30):null;
 hemi.intensity=on?(n?.5:.9):.8;sun.color.set(on&&n?0xffa060:0xffffff);ground.material.color.set(on?(rain?0x2c3a2c:0x4f7a3c):0x5a5c63);ground.material.metalness=on&&rain?.5:0;ground.material.roughness=on&&rain?.2:.9;
 objs.forEach(o=>o.traverse(m=>{if(m.isMesh&&m!==o.userData.eyes){m.material.color.set(on?(o.userData.kind==='robot'?(/rust/.test($('#look').value)?0x8a4a2a:0x9aa0a8):o.userData.kind==='box'?0x6b4a2b:0xb8322a):(o.userData.kind==='sneaker'?0xb8322a:o.userData.kind==='robot'?0x8d949c:0x9a9ca4))}}));
 objs.forEach(o=>o.userData.eyes&&o.userData.eyes.material.color.set(on?0x77ffff:0x222222));grid.visible=!on&&mode==='dress';if(cloud)cloud.material.size=on?.12:.07;if(plate)plate.material.color.set(on?(n?0x8877aa:0xffffff):0xffffff)}
const wipe=document.createElement('div');wipe.className='wipe hidden';vp.append(wipe);
wipe.onpointerdown=e=>{e.stopPropagation();wipe.setPointerCapture(e.pointerId);wipe.onpointermove=ev=>{const b=vp.getBoundingClientRect();wipeX=Math.min(1,Math.max(0,(ev.clientX-b.left)/b.width))}};wipe.onpointerup=()=>wipe.onpointermove=null;
const go=K.steps(s=>{mode=s;['#left','#right'].forEach(q=>$(q).classList.toggle('hidden',s==='start'));$('#stage').classList.toggle('vpm',s!=='start');wipe.classList.toggle('hidden',s!=='result');
 $('#vpl').textContent=s==='result'?'Set playblast ⇆ Final':'Scan + grey blocks + GLB, all in one scene';if(s!=='start'&&!objs.length)$$('[data-start]')[0].click();setTimeout(resize)});
$('#shoot').onclick=async()=>{await K.render($('#stage'),['Recording playblast…','LTX-2.5 + Layout to Render…','Decoding…'],2600);go('result')};
$('#newAngle').onclick=()=>{sph.th+=1.2;orbit=!orbit;K.toast('New camera, same set — re-shoot to render')};
function resize(){const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;R.setSize(w,h);[ed,shot].forEach(c=>{c.aspect=w/h;c.updateProjectionMatrix()})}addEventListener('resize',resize);
let T=0;K.loop(t=>{if(playing)T=t;if(mode==='start')return;
 const u=(T/8)%1;if(orbit)shot.position.set(target.x+Math.sin(u*6.28)*6,target.y+1.2,target.z+Math.cos(u*6.28)*6);else shot.position.set(target.x,target.y+.6,target.z+9-u*4);shot.lookAt(target);
 ed.position.set(sph.r*Math.sin(sph.ph)*Math.sin(sph.th),sph.r*Math.cos(sph.ph),sph.r*Math.sin(sph.ph)*Math.cos(sph.th));ed.lookAt(0,1,0);
 objs.forEach(o=>{if(o.userData.box)o.userData.box.visible=false});const W=vp.clientWidth,H=vp.clientHeight;
 if(mode==='result'){objs.forEach(o=>o.traverse(m=>m.isMesh&&m.material.emissive&&m.material.emissive.set(0)));R.setScissorTest(true);look(false);R.setScissor(0,0,W*wipeX,H);R.render(scene,shot);look(true);R.setScissor(W*wipeX,0,W*(1-wipeX),H);R.render(scene,shot);R.setScissorTest(false);wipe.style.left=wipeX*100+'%'}
 else{look(false);objs.forEach(o=>o.traverse(m=>m.isMesh&&m.material.emissive&&m.material.emissive.set(o===sel?0x1a2a66:0)));R.render(scene,ed)}});
</script></body></html>
