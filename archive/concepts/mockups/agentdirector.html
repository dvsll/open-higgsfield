<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Director Mockup</title><link rel="stylesheet" href="kit.css"><style>
.log{width:100%;max-width:760px;flex:1;min-height:200px;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:10px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace}
.log div{padding:2px 0;animation:in .25s}@keyframes in{from{opacity:0}}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:760px}
.sc{background:var(--panel);border:1px solid var(--edge);border-radius:8px;overflow:hidden}.sc canvas{width:100%;display:block;aspect-ratio:16/9}
.sc div{padding:5px 8px;font-size:12px;display:flex}.sc div b{margin-left:auto;font-weight:500}
.stage{justify-content:flex-start}
.status{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.run{background:var(--ok);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
</style></head><body>
<div class="bar"><a class="back" href="../index.html">←</a><span class="brand">✦ Agent Director</span><span class="note">mockup — the agent's run is scripted</span><span class="status" style="margin-left:auto"><i class="dot" id="dot"></i><span id="st">Idle</span></span></div>
<div class="body">
 <div class="side">
  <div class="h">Brief</div><textarea class="inp" id="brief" style="min-height:120px">15s teaser: abandoned greenhouse turns lush overnight, ends on a single flower opening</textarea>
  <div class="h">Budget</div><div class="chips" data-g="att"><button class="chip" data-v="2">2 attempts</button><button class="chip on" data-v="4">4 attempts</button><button class="chip" data-v="6">6</button></div>
  <div class="note">$3 cap · stops early when every shot scores ≥ 7</div>
  <button class="btnp" id="go" style="margin-top:8px">Direct</button><button class="btng hidden" id="stop">Stop</button>
  <button class="btng hidden" id="watch" style="margin-top:6px">▶ Watch teaser</button>
 </div>
 <div class="stage" id="stage">
  <div class="shots" id="shots"></div>
  <div class="log" id="log"><div class="note">The agent's plan, tool calls (Comfy MCP), renders and self-critiques show up here.</div></div>
 </div>
</div>
<div class="ov" id="tv" style="display:none"><div class="vid" style="max-width:800px"><canvas id="tc"></canvas><span class="lbl" style="left:10px" id="tl"></span></div><button class="btng" onclick="tv.style.display='none'">Close</button></div>
<script src="kit.js"></script><script>
const {$,$$}=K;let stop=false;
const SH=[{n:'1 · wide',grow:0},{n:'2 · time-lapse',grow:0},{n:'3 · macro flower',grow:0}];
function house(g,t,grow,macro,glitch){const W=g.canvas.width,H=g.canvas.height,s=W/320;
 if(macro){g.fillStyle='#1d2b1a';g.fillRect(0,0,W,H);g.fillStyle='#2f5a2a';g.fillRect(W*.48,H*.55,6*s,H);const o=grow;for(let i=0;i<8;i++){const a=i/8*6.28;g.fillStyle=`hsl(${330+i*3},70%,${55+o*10}%)`;g.beginPath();g.ellipse(W/2+Math.cos(a)*o*22*s,H*.5+Math.sin(a)*o*14*s,(6+o*16)*s,(4+o*8)*s,a,0,7);g.fill()}g.fillStyle='#ffd166';g.beginPath();g.arc(W/2,H*.5,6*s,0,7);g.fill();return}
 K.paint(g,{sky:grow>.5?['#ffcf8f','#fff0d0']:['#7a8794','#c8ced4'],buildings:false,road:false,trees:false,clouds:false,people:0,ground:K.mix('#6d6457','#4f8a3c',grow),extra:(g)=>{
  g.strokeStyle='#cfd8dc';g.lineWidth=2*s;g.fillStyle=`rgba(200,230,240,${.15+grow*.1})`;g.beginPath();g.moveTo(W*.2,H*.62);g.lineTo(W*.2,H*.32);g.lineTo(W*.5,H*.14);g.lineTo(W*.8,H*.32);g.lineTo(W*.8,H*.62);g.closePath();g.fill();g.stroke();
  for(let i=1;i<6;i++){g.beginPath();g.moveTo(W*(.2+i*.1),H*.62);g.lineTo(W*(.2+i*.1),H*(i<3?.32-(i*.06):.32-((6-i)*.06)));g.stroke()}
  const n=Math.floor(grow*40);for(let i=0;i<n;i++){const x=W*(.22+((i*37)%56)/100),h=(10+(i*13)%30)*s*Math.min(1,grow*1.5);g.fillStyle=i%5?'#3f8a3a':'#e76f9a';g.beginPath();g.ellipse(x,H*.62-h/2,4*s,h/2,0,0,7);g.fill()}
  if(glitch){for(let i=0;i<6;i++){g.fillStyle='#3f8a3a';g.fillRect(W*(.3+i*.08),H*.4,12*s,30*s)}}}},t)}
function cards(){$('#shots').innerHTML='';SH.forEach((s,i)=>{const d=document.createElement('div');d.className='sc';d.innerHTML=`<canvas width="320" height="180"></canvas><div>${s.n}<b id="sc${i}">queued</b></div>`;s.g=d.querySelector('canvas').getContext('2d');$('#shots').append(d)})}
const log=(t,c)=>{const d=document.createElement('div');d.innerHTML=t;if(c)d.style.color=c;$('#log').append(d);$('#log').scrollTop=1e9};
const status=(i,t,c)=>{const e=$('#sc'+i);e.textContent=t;e.style.color=c||''};
async function renderShot(i,grow,glitch,label){status(i,'rendering…','var(--hi)');for(let k=0;k<=10&&!stop;k++){SH[i].grow=grow*k/10;SH[i].glitch=glitch;await K.sleep(90)}}
$('#go').onclick=async()=>{stop=false;$('#log').innerHTML='';cards();$('#go').classList.add('hidden');$('#stop').classList.remove('hidden');$('#watch').classList.add('hidden');$('#dot').classList.add('run');
 const max=+K.chip('att'),steps=[
 async()=>{$('#st').textContent='Planning';log('🧠 Plan: 3 shots. Shot 1 wide, shot 2 time-lapse growth, shot 3 macro flower.')},
 async()=>log('🔧 MCP: load LTX-2.5 workflow · text-to-video · 540p draft'),
 async()=>{$('#st').textContent='Running · shot 1';log('🎬 Render shot 1 · attempt 1');await renderShot(0,0);log('👀 Critique: empty greenhouse reads well, light flat but fine. <b>Score 8/10</b>','var(--ok)');status(0,'✓ 8/10','var(--ok)')},
 async()=>log('🔧 MCP: load LTX-2.5 + Day to Night (reverse) for shot 2'),
 async()=>{$('#st').textContent='Running · shot 2 · attempt 1';log('🎬 Render shot 2 · attempt 1 → done (2m10s)');await renderShot(1,1,true);log('👀 Critique: growth too fast, plants pop in. <b>Score 4/10</b>','var(--bad)');status(1,'✗ 4/10','var(--bad)')},
 async()=>{if(max<2)return;log('🔁 Retry: slower prompt, keyframe at 50% from shot 1 end');$('#st').textContent='Running · shot 2 · attempt 2';log('🎬 Render shot 2 · attempt 2');await renderShot(1,1,false);log('👀 Critique: smooth overnight growth, continuity with shot 1 ✓ <b>Score 8/10</b>','var(--ok)');status(1,'✓ 8/10 (2 tries)','var(--ok)')},
 async()=>{$('#st').textContent='Running · shot 3';log('🎬 Render shot 3 · attempt 1 · macro');await renderShot(2,1);log('👀 Critique: flower opens, colour matches board. <b>Score 7/10</b>','var(--ok)');status(2,'✓ 7/10','var(--ok)')},
 async()=>log('✂ Assemble: 5s + 6s + 4s · crossfades · $1.84 spent · 4 renders'),
 async()=>{$('#st').textContent='Done';log('✅ Teaser ready.','var(--ok)');$('#watch').classList.remove('hidden')}];
 for(const s of steps){if(stop){log('⏹ Stopped by you.','var(--warm)');$('#st').textContent='Stopped';break}await s();await K.sleep(500)}
 $('#dot').classList.remove('run');$('#go').classList.remove('hidden');$('#go').textContent='Direct again';$('#stop').classList.add('hidden')};
$('#stop').onclick=()=>stop=true;K.chips();
const tg=K.canvas($('#tc'),640,360);let w0=0;$('#watch').onclick=()=>{w0=performance.now();$('#tv').style.display='flex'};
K.loop(t=>{SH.forEach((s,i)=>s.g&&house(s.g,t,s.grow,i===2,s.glitch&&Math.sin(t*8)>0));
 if($('#tv').style.display==='flex'){const e=((performance.now()-w0)/1000)%15;const i=e<5?0:e<11?1:2,u=i===0?0:i===1?(e-5)/6:(e-11)/4;house(tg,t,i===0?0:Math.min(1,u*1.1),i===2,false);$('#tl').textContent=`${e.toFixed(1)}s / 15s · shot ${i+1}`}});
cards();
</script></body></html>
