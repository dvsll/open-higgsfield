<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Studio Mockup</title><link rel="stylesheet" href="kit.css"><style>
.outs{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center;width:100%}
.out{display:flex;flex-direction:column;gap:6px;align-items:center}.out canvas{border-radius:8px;background:#000;display:block}
.prod{width:100%;aspect-ratio:1;border-radius:8px;background:#2b2d36;display:block}
</style></head><body>
<div class="bar"><a class="back" href="../index.html">←</a><span class="brand">◉ Ad Studio</span><span class="note">mockup — ads faked in-browser · MiniMax H3 (open weights)</span>
<div class="nav"><button data-s="brief" class="on">1 Brief</button><button data-s="ads">2 Ads</button></div></div>
<div class="body">
 <div class="side">
  <div class="h">Product photo</div><canvas id="prod" class="prod" width="240" height="240"></canvas>
  <div class="chips" data-g="prod"><button class="chip on" data-v="can">Cold brew can</button><button class="chip" data-v="shoe">Sneaker</button><button class="chip" data-v="bottle">Sauce bottle</button></div>
 </div>
 <div class="stage" id="stage">
  <div class="outs" id="outs"></div>
  <div class="note" id="empty">Fill in the brief and hit “Make ads”.</div>
 </div>
 <div class="side r">
  <div class="h">Pitch</div><textarea class="inp" id="pitch">Cold brew in a can. Summer, beach, upbeat.</textarea>
  <div class="h">Tagline</div><input class="inp" id="tag" value="Cold. Brewed. Ready.">
  <div class="h">Vibe</div><div class="chips" data-g="vibe"><button class="chip on" data-v="life">Lifestyle</button><button class="chip" data-v="studio">Studio</button><button class="chip" data-v="ugc">UGC</button></div>
  <div class="h">Length</div><div class="chips" data-g="len"><button class="chip" data-v="6">6 s</button><button class="chip on" data-v="15">15 s</button></div>
  <button class="btnp" id="go" style="margin-top:10px">Make ads · ~3 min</button>
  <div data-p="ads" class="hidden" style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
   <button class="btng" id="snd">🔊 Audio: off</button>
   <button class="btng" onclick="K.toast('mock: zip of 3 MP4s')">Download all</button></div>
 </div>
</div>
<script src="kit.js"></script><script>
const {$,$$}=K;let made=false,audio=null;
function product(g,kind,x,y,s,t){g.save();g.translate(x,y);g.rotate(Math.sin(t*1.5)*.06);
 if(kind==='can'){g.fillStyle='#1d3557';g.fillRect(-22*s,-50*s,44*s,100*s);g.fillStyle='#e0e0e0';g.fillRect(-22*s,-54*s,44*s,6*s);g.fillStyle='#f4a261';g.fillRect(-22*s,-12*s,44*s,22*s);g.fillStyle='#fff';g.font=`bold ${10*s}px system-ui`;g.fillText('COLD',-14*s,3*s)}
 if(kind==='shoe'){g.fillStyle='#e63946';g.beginPath();g.moveTo(-50*s,10*s);g.quadraticCurveTo(-46*s,-30*s,-10*s,-30*s);g.lineTo(6*s,-12*s);g.quadraticCurveTo(48*s,-10*s,50*s,10*s);g.fill();g.fillStyle='#fff';g.fillRect(-52*s,8*s,104*s,10*s)}
 if(kind==='bottle'){g.fillStyle='#9d0208';g.beginPath();g.roundRect(-20*s,-30*s,40*s,80*s,8*s);g.fill();g.fillRect(-8*s,-56*s,16*s,28*s);g.fillStyle='#ffba08';g.fillRect(-20*s,-4*s,40*s,24*s)}
 g.restore()}
function ad(g,t,ratio){const W=g.canvas.width,H=g.canvas.height,vibe=K.chip('vibe'),kind=K.chip('prod'),s=Math.min(W,H)/160,len=+K.chip('len'),u=(t%len)/len;
 if(vibe==='studio'){const r=g.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.7);r.addColorStop(0,'#fafafa');r.addColorStop(1,'#b8c0cc');g.fillStyle=r;g.fillRect(0,0,W,H)}
 else K.paint(g,{sky:['#58b6ef','#c8ecff'],ground:'#ecd9a0',buildings:false,road:false,trees:false,water:.12,people:vibe==='ugc'?1:0,horizon:.6},t);
 const z=1+u*.15;g.save();g.translate(W/2,H*.55);g.scale(z,z);if(vibe==='ugc'){g.rotate(Math.sin(t*3)*.03)}product(g,kind,0,0,s*1.1,t);g.restore();
 if(vibe==='ugc'){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,H-36*s/2-10,W,36*s/2+10);g.fillStyle='#fff';g.font=`600 ${9*s}px system-ui`;g.fillText('ok this is actually so good',10,H-12)}
 if(u>.55){g.globalAlpha=Math.min(1,(u-.55)*5);g.fillStyle=vibe==='studio'?'#111':'#fff';g.font=`800 ${(ratio==='9:16'?13:15)*s}px system-ui`;g.textAlign='center';g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=vibe==='studio'?0:6;g.fillText($('#tag').value,W/2,H*.18);g.shadowBlur=0;g.textAlign='left';g.globalAlpha=1}
 g.fillStyle='rgba(255,255,255,.8)';g.fillRect(0,H-3,W*u,3)}
const sizes={'16:9':[384,216],'9:16':[162,288],'1:1':[216,216]};const out={};
function layout(){$('#outs').innerHTML='';Object.entries(sizes).forEach(([r,[w,h]])=>{const d=document.createElement('div');d.className='out';d.innerHTML=`<canvas width="${w*2}" height="${h*2}" style="width:${w}px;height:${h}px"></canvas><span class="note">${r} · ${r==='16:9'?'YouTube':r==='9:16'?'Reels / TikTok':'Feed'} · 🔊 ${K.chip('len')}s</span>`;out[r]=d.querySelector('canvas').getContext('2d');$('#outs').append(d)})}
K.chips(()=>made&&(made=false,$('#outs').innerHTML='',$('#empty').classList.remove('hidden')));
const go=K.steps();
$('#go').onclick=async()=>{await K.render($('#stage'),['Reading product photo…','MiniMax H3 · reference-to-video + audio…','Cutting 16:9 / 9:16 / 1:1…'],2800);layout();made=true;$('#empty').classList.add('hidden');go('ads')};
$('#snd').onclick=()=>{if(audio){audio.close();audio=null;$('#snd').textContent='🔊 Audio: off';return}audio=new AudioContext();$('#snd').textContent='🔊 Audio: on (placeholder jingle)';
 const notes=[523,659,784,659,587,698,880,698];let i=0;(function beat(){if(!audio)return;const o=audio.createOscillator(),gn=audio.createGain();o.type='triangle';o.frequency.value=notes[i++%8];gn.gain.setValueAtTime(.12,audio.currentTime);gn.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(gn).connect(audio.destination);o.start();o.stop(audio.currentTime+.3);setTimeout(beat,250)})()};
const pg=$('#prod').getContext('2d');
K.loop(t=>{pg.fillStyle='#e9ecef';pg.fillRect(0,0,240,240);product(pg,K.chip('prod'),120,125,1.6,0);if(made)Object.entries(out).forEach(([r,g])=>ad(g,t,r))});
</script></body></html>
