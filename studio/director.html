</style></head><body>
<header><a href="../index.html">←</a><h1>Director</h1><span class="proj">/ The Robot in the Junkyard</span><span class="sp"></span>
 <span id="rt" class="rt" title="Generation: Vite /api (shared/runtime/api.ts) → @comfyorg/sdk → ComfyUI">○ placeholders</span>
 <button class="pill" id="genAll">Generate all shots</button></header>
<div class="app">
 <aside class="l" id="shared"></aside>
 <main>
  <div class="title"><h2 id="sTitle"><span id="sNum"></span><span id="sName" contenteditable="plaintext-only" spellcheck="false" title="Click to rename (F2)"></span><span class="pen">✎</span></h2><span id="sMeta"></span><span class="sp"></span><span id="sState"></span></div>
  <div class="view"><canvas id="cv"></canvas><video id="vid" muted playsinline preload="auto"></video>
   <div class="empty" id="empty"><div class="msg"><h3 id="emT">Bring your scene to life</h3><p id="emP">Press Generate to get started.</p></div>
    </div><span class="tag" id="tag"></span><span class="tc" id="tc"></span>
   <div class="ov" id="ov"><div id="ovt"></div><div class="prog"><i id="pb"></i></div></div></div>
  <div class="modelbar"><label for="videoModel">Video</label><select id="videoModel" disabled><option>Connecting…</option></select><div id="videoModelDetails" class="model-card" aria-live="polite"></div></div>
  <div class="row">
   <button class="play" id="play" title="Play / pause (space)">▶</button>
   <div class="prompt-field" data-model-kind="video" data-model-control="shotPromptInput"><label for="shotPromptInput">Shot prompt</label><textarea id="shotPromptInput" rows="2" placeholder="Describe the scene and visual details…"></textarea></div>
   <div class="prompt-field" data-model-kind="video" data-model-control="motion"><label for="motion">Motion prompt</label><textarea id="motion" rows="2" placeholder="Describe subject and camera movement…"></textarea></div>
   <button class="pill solid" id="gen" style="white-space:nowrap;padding:0 18px">Generate shot</button>
  </div>
  <div class="tlw">
   <div class="tlh"><span class="crumb" id="crumb"></span><span id="tot"></span><span class="sp"></span><span class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0"><span id="hintT"></span></span><button id="trashBtn" class="trashb" title="Deleted shots (restorable)"></button><button id="addKeyBtn" title="Add a keyframe at the playhead (copies the nearest one)">＋ Keyframe</button><button id="editKey" title="Open the selected keyframe in Edit Anything">✎ Edit keyframe</button><button id="delKey">Remove key</button></div>
   <div class="tl" id="tl"><div class="ruler" id="ruler"></div><div class="trk" id="trk"></div><div class="gph" id="gph" role="img" aria-label="Playhead"></div></div>
   <div class="stash" id="stash"></div><div class="trashpop" id="trashpop"></div>
  </div>
  <div class="hist" id="hist"></div>
 </main>
 <aside class="r">
  <div class="sec">Generate keyframe</div>
  <div class="modelbar image-modelbar"><label for="keyframeModel">Image</label><select id="keyframeModel" disabled><option>Connecting…</option></select><div id="keyframeModelDetails" class="model-card" aria-live="polite"></div></div>
  <details class="local-models"><summary>Local models · <span id="modelCount">connecting</span></summary><button id="refreshModels" type="button">Refresh models</button><p id="modelStatus" role="status"></p><div id="modelInventory"></div></details>
  <div class="prompt-field" data-model-kind="keyframe" data-model-control="kp"><label for="kp">Image prompt</label><textarea id="kp" rows="3">Mia holds Bolt up to the window, first light on his face</textarea></div>
  <div class="sec">Elements</div>
  <div class="chips" id="els"></div>
  <div class="sec">Framing</div>
  <div class="chips" id="frm"></div>
  <div style="color:var(--faint);font-size:12px">Look: <span id="lookUse"></span>, from Stylization</div>
  <button class="pill solid" id="kgo" style="width:100%">Generate 4 keyframes</button>
  <div class="sec">Results <span>click = add to selected shot<br>or drag onto a clip</span></div>
  <div id="res"><div class="empty">Generated keyframes show up here.</div></div>
 </aside>
</div>
<svg id="generateArrow" aria-hidden="true"><defs><marker id="generateArrowTip" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M3 3 L17 10 L3 17" /></marker></defs><path id="generateArrowCurve" marker-end="url(#generateArrowTip)" /></svg><script type="module" src="./src/director.ts"></script></body></html>
