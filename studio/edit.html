<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Anything Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--col:#141416;--card:#1a1a1d;--line:#26262a;--txt:#ececef;--dim:#8b8b93;--faint:#5a5a62;--acc:#e8e3d9;--sel:#7aa2ff;--ok:#5bbf8a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 Inter,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
header a{color:var(--faint);text-decoration:none}header h1{font-size:14px;font-weight:600;margin:0}header .src{color:var(--dim)}header .sp{flex:1}
.from{font-size:11px;border:1px solid #3a4462;color:#aab6d8;border-radius:99px;padding:2px 9px}
.pill{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--txt)}
.pill:hover{border-color:var(--faint)}.pill.solid{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}.pill:disabled{opacity:.4;cursor:default}
.app{display:grid;grid-template-columns:250px 1fr 290px;min-height:0}
aside{background:var(--col);overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line)}
.sec{font-size:11px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:8px}
.sec span{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--faint)}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--card);border:1px solid transparent}
.layer.off{opacity:.45}.layer.hl{border-color:var(--sel)}
.layer .ic{width:26px;height:26px;border-radius:6px;background:#2a2a2e;display:grid;place-items:center;flex:none}
.layer small{display:block;color:var(--faint)}.layer .x{margin-left:auto;display:flex;gap:2px}
.layer .x button{background:none;border:0;cursor:pointer;color:var(--dim);width:24px;height:24px;border-radius:5px}.layer .x button:hover{background:#26262a;color:var(--txt)}
.empty{color:var(--faint);font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center}
main{display:flex;flex-direction:column;min-width:0;padding:16px 22px;gap:12px;overflow:auto}
.bar{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px}
.seg button{border:0;background:none;border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--dim)}.seg button.on{background:#26262a;color:var(--txt)}
.bar .sp{flex:1}.bar .hint{color:var(--faint);font-size:12px}
.view{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-height:70vh;align-self:center;flex:none}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{cursor:crosshair}
.wipe{position:absolute;top:0;bottom:0;width:2px;background:#fff;cursor:ew-resize;z-index:3;touch-action:none}
.wipe::after{content:"";position:absolute;top:50%;left:-11px;width:24px;height:24px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lab{position:absolute;bottom:10px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 9px;border-radius:99px;color:#ddd;pointer-events:none;z-index:2}
.ask{position:absolute;z-index:4;display:flex;align-items:center;gap:6px;background:rgba(20,20,22,.92);backdrop-filter:blur(8px);border:1px solid #3a4462;border-radius:12px;padding:6px 6px 6px 10px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.ask b{font-weight:500;color:#aab6d8;white-space:nowrap}
.ask input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:inherit;outline:none}
.ask button{border:0;border-radius:8px;background:var(--acc);color:#111;padding:4px 10px;cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--dim);font-size:12px}
.chip:hover{border-color:var(--faint);color:var(--txt)}.chip.on{border-color:var(--acc);color:var(--txt);background:#1f1f22}
.selc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card)}
.selc .ic{width:34px;height:34px;border-radius:8px;background:#2a2a2e;display:grid;place-items:center;font-size:18px}
.selc small{display:block;color:var(--faint)}
input.t{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font:inherit;outline:none}
input.t:focus{border-color:var(--faint)}
.drop{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--faint);font-size:12px;cursor:pointer}
.note{color:var(--faint);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;transition:opacity .3s;z-index:20}
@media (max-width:1000px){.app{grid-template-columns:1fr}aside.l,aside.r{border:0;border-top:1px solid var(--line)}aside.l{order:2}main{order:1}aside.r{order:3}}
/* No rounded corners anywhere for now (overrides shell.js styles too). */
*,*::before,*::after{border-radius:0!important}
/* The viewport owns the workspace; only its panels scroll. */
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;grid-template-rows:auto minmax(0,1fr)}
.app{min-width:0;min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr)}
main,aside{min-height:0;min-width:0;overscroll-behavior:contain}
main{overflow-x:hidden;overflow-y:auto}main>*{flex-shrink:0}
@media(max-width:1000px){.app{overflow-y:auto;grid-template-rows:none;grid-auto-rows:max-content;align-content:start;overscroll-behavior:contain}main,aside{overflow:visible;max-height:none}}
</style></head><body><div id="studio-root"></div><script type="module" src="./src/react/edit-app.tsx"></script></body></html>
